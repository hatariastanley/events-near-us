name: Refresh weekend events

on:
  schedule:
    # Monday 7:00 AM ET (11:00 UTC) — early-planning pass
    - cron: "0 11 * * 1"
    # Thursday 6:00 PM ET (22:00 UTC) — top-up after weekly roundups publish
    - cron: "0 22 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch raw listings
        run: python scripts/fetch_events.py

      - name: Curate + rank into events.json
        run: python scripts/curate.py

      - name: Commit if changed
        run: |
          git config user.name "events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/raw_events.json
          git diff --cached --quiet || git commit -m "Refresh weekend events ($(date +%Y-%m-%d))"
          git push
